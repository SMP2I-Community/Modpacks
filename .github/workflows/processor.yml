on:
  push:
    paths:
      - '*.zip'

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Detect changed zips
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^[^/]+\.zip$')
          echo "zips=$CHANGED" >> $GITHUB_OUTPUT

      - name: Process zips
        env:
          CURSEFORGE_KEY: ${{ secrets.CURSEFORGE_KEY }}
        if: steps.detect.outputs.zips != ''
        run: |
          for zip in ${{ steps.detect.outputs.zips }}; do
            python scripts/process_modpack.py $CURSEFORGE_KEY $zip
          done
      
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./modpacks
          destination_dir: modpacks
          exclude_assets: '**.zip'
          keep_files: true