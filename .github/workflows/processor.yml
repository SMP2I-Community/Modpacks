name: Process Modpack

on:
  push:
    branches: [main]
    paths:
      - 'manifests/*.json'
      - 'manifests/**/*.zip'

permissions:
  contents: write

concurrency:
  group: process-modpack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests

      - name: Detect changed zips
        run: |
          git diff --name-only --diff-filter=AM HEAD^ HEAD -- manifests/ > /tmp/added_modified.txt || true
          git diff --name-only --diff-filter=D HEAD^ HEAD -- manifests/ > /tmp/deleted.txt || true

          if [ ! -s /tmp/added_modified.txt ] && [ ! -s /tmp/deleted.txt ]; then
            ls *.zip 2>/dev/null > /tmp/added_modified.txt || true
          fi

          echo "Added/Modified:"; cat /tmp/added_modified.txt
          echo "Deleted:"; cat /tmp/deleted.txt
          touch /tmp/added_modified.txt /tmp/deleted.txt

      - name: Fetch existing index.json from data branch
        run: |
          mkdir -p /tmp/output
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git show origin/data:index.json > /tmp/output/index.json 2>/dev/null || echo '{"modpacks": []}' > /tmp/output/index.json
          else
            echo '{"modpacks": []}' > /tmp/output/index.json
          fi

      - name: Process added/modified zips
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Processing $f"
            python scripts/process_modpack.py process "$f" /tmp/output
          done < /tmp/added_modified.txt

      - name: Remove deleted modpacks
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "Removing $f"
            python scripts/process_modpack.py remove "$f" /tmp/output
          done < /tmp/deleted.txt

      - name: Checkout/prepare data branch
        run: |
          git fetch origin data || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout data
          else
            git checkout --orphan data
            git rm -rf . || true
          fi

      - name: Copy generated files into data branch
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            id=$(python3 -c "import re,sys; from pathlib import Path; n=Path(sys.argv[1]).stem.strip().lower(); n=re.sub(r'[^\w\-]','-',n); n=re.sub(r'-+','-',n); print(n.strip('-'))" "$f")
            rm -rf "$id"
            echo "Removed data folder: $id"
          done < /tmp/deleted.txt

          for dir in /tmp/output/*/; do
            id=$(basename "$dir")
            [ "$id" = "*" ] && continue
            rm -rf "$id"
            mkdir -p "$id"
            cp -r "$dir"/* "$id"/
          done

          cp /tmp/output/index.json index.json

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || git commit -m "Update modpack data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push origin data